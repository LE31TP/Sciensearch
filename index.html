<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sciensearch - Scientific Paper Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Mermaid.js for flowcharts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- PDF.js for reading PDF files in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-cyan-500/10 border border-cyan-500/30 p-2 rounded-xl text-cyan-400">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Sciensearch AI</h1>
                    <p class="text-xs text-slate-400">Automatic analyzer for scientific methodologies and protocols</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> System Active
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Data Input & History -->
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur">
                <h2 class="text-lg font-semibold flex items-center gap-2 mb-4">
                    <i data-lucide="file-text" class="text-cyan-400 w-5 h-5"></i> Load Paper or Methodology
                </h2>

                <!-- PDF / TXT File Upload Button -->
                <div class="mb-4">
                    <label class="block text-xs font-medium text-slate-400 mb-2">Upload PDF or TXT paper (AI Semantic Extractor):</label>
                    <label class="w-full bg-slate-800 hover:bg-slate-700 border-2 border-dashed border-cyan-500/40 hover:border-cyan-400 p-3 rounded-xl cursor-pointer transition flex items-center justify-center gap-3 text-cyan-300 shadow-inner group">
                        <i data-lucide="upload-cloud" class="w-5 h-5 group-hover:scale-110 transition"></i>
                        <div class="text-left">
                            <span class="text-xs font-semibold block text-white" id="uploadButtonLabel">Click to upload PDF or TXT</span>
                            <span class="text-[10px] text-slate-400">Scores blocks & auto-formats APA citation</span>
                        </div>
                        <input type="file" id="paperFileInput" accept=".pdf,.txt" class="hidden" onchange="handleFileUpload(event)">
                    </label>
                    <p id="uploadStatus" class="text-[11px] text-emerald-400 mt-1 hidden text-center font-medium"></p>
                </div>

                <!-- APA Citation Metadata Fields -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Author(s) (APA):</label>
                        <input type="text" id="paperAuthor" placeholder="e.g., Smith, J. et al." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Year:</label>
                        <input type="text" id="paperYear" placeholder="e.g., 2026" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                </div>

                <!-- Quick Presets -->
                <div class="mb-4">
                    <label class="block text-xs font-medium text-slate-400 mb-2">Or try with a preloaded example:</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="loadPreset('gold')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700/60 p-2.5 rounded-xl transition text-left">
                            <span class="font-medium block text-cyan-300">Gold Nanoparticles</span>
                            <span class="text-[10px] text-slate-400">Turkevich (2023)</span>
                        </button>
                        <button onclick="loadPreset('dna')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700/60 p-2.5 rounded-xl transition text-left">
                            <span class="font-medium block text-cyan-300">DNA Extraction</span>
                            <span class="text-[10px] text-slate-400">Doyle (2022)</span>
                        </button>
                        <button onclick="loadPreset('pcr')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700/60 p-2.5 rounded-xl transition text-left">
                            <span class="font-medium block text-cyan-300">PCR Assay</span>
                            <span class="text-[10px] text-slate-400">Mullis (2021)</span>
                        </button>
                    </div>
                </div>

                <!-- Main Textarea -->
                <div class="space-y-2">
                    <label for="paperText" class="block text-xs font-medium text-slate-400">Paper text / Materials & Methods section:</label>
                    <textarea id="paperText" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition resize-none" placeholder="Extracted methodology will appear here..."></textarea>
                </div>

                <!-- Analysis Button & Save Button -->
                <div class="mt-4 flex gap-2">
                    <button onclick="analizarPaper()" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-semibold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <i data-lucide="wand-2" class="w-5 h-5"></i> Generate Protocol
                    </button>
                    <button onclick="saveCurrentPaper()" title="Save paper in APA format to local storage" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-400 px-4 rounded-xl transition flex items-center justify-center">
                        <i data-lucide="bookmark-plus" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Saved Papers / History Box -->
            <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-semibold flex items-center gap-2 text-slate-200">
                        <i data-lucide="archive" class="text-cyan-400 w-4 h-4"></i> Saved Papers (APA Format)
                    </h3>
                    <span id="savedCount" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0 saved</span>
                </div>
                <div id="savedList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500 italic text-center py-4">No saved papers yet. Click the bookmark icon to store your analysis.</p>
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 text-center">
                    <span class="block text-xl font-bold text-cyan-400" id="statSteps">0</span>
                    <span class="text-[11px] text-slate-400">Total steps</span>
                </div>
                <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 text-center">
                    <span class="block text-xl font-bold text-emerald-400" id="statReqs">0</span>
                    <span class="text-[11px] text-slate-400">Reagents / Items</span>
                </div>
                <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 text-center">
                    <span class="block text-xl font-bold text-purple-400" id="statTime">0 min</span>
                    <span class="text-[11px] text-slate-400">Estimated time</span>
                </div>
            </div>
        </section>

        <!-- Right Column: Results (Flowchart & Step-by-Step) -->
        <section class="lg:col-span-7 space-y-6">
            <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur min-h-[600px] flex flex-col">
                
                <!-- View Tabs -->
                <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
                    <div class="flex space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="switchTab('flowchart')" id="tabFlowchartBtn" class="px-4 py-2 text-xs font-medium rounded-lg bg-cyan-500/10 text-cyan-400 transition flex items-center gap-2">
                            <i data-lucide="git-commit" class="w-4 h-4"></i> Flowchart
                        </button>
                        <button onclick="switchTab('steps')" id="tabStepsBtn" class="px-4 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex items-center gap-2">
                            <i data-lucide="list-ordered" class="w-4 h-4"></i> Step-by-Step
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="copiarResultados()" title="Copy text" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
